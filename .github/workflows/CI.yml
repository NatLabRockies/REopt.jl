name: Run tests

on:
  push:
    paths-ignore: [README.md, CHANGELOG.md]
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  pick-urdb-key:
    # Randomly choose one of the three URDB API keys to spread usage across them
    runs-on: ubuntu-latest
    outputs:
      key-index: ${{ steps.pick.outputs.key-index }}
    steps:
      - id: pick
        run: echo "key-index=$(( RANDOM % 3 + 1 ))" >> "$GITHUB_OUTPUT"
        shell: bash

  highstests:
    needs: pick-urdb-key
    runs-on: ${{ matrix.os }}
    env:
      URDB_API_KEY: ${{ secrets[format('URDB_API_KEY_{0}', needs.pick-urdb-key.outputs.key-index)] }}
    strategy:
      matrix:
        julia-version: ['1.13']
        julia-arch: [x64]
        os: [ubuntu-latest]

    steps:
      # GitHub does not expose repository secrets to pull_request runs from forks,
      # so the test suite cannot authenticate against the URDB/NLR developer APIs.
      # Fail fast with an actionable message rather than reporting a false green.
      - name: Check that API secrets are available
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::This pull request comes from a fork, so GitHub does not provide the repository secrets (NLR_DEVELOPER_API_KEY, URDB_API_KEY_1, URDB_API_KEY_2, URDB_API_KEY_3, NLR_DEVELOPER_EMAIL) that the test suite requires. A maintainer must push this branch to NatLabRockies/REopt.jl and open a pull request from there to run CI."
          exit 1
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@latest
      # - uses: mxschmitt/action-tmate@v3  # for interactive debugging
      - run: julia --project=. -e 'using Pkg; Pkg.activate("test"); Pkg.rm("Xpress"); Pkg.activate("."); using TestEnv; TestEnv.activate(); Pkg.add(PackageSpec(name="GhpGhx", url="https://github.com/NatLabRockies/GhpGhx.jl.git")); using GhpGhx; cd("test"); include("runtests.jl")'
        shell: bash
        env:
          NLR_DEVELOPER_API_KEY: ${{ secrets.NLR_DEVELOPER_API_KEY }}
          NLR_DEVELOPER_EMAIL: ${{ secrets.NLR_DEVELOPER_EMAIL }}
