name: Run tests

on:
  push:
    paths-ignore: [README.md, CHANGELOG.md]
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  highstests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1.13']
        julia-arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@latest
      # - uses: mxschmitt/action-tmate@v3  # for interactive debugging
      # TEMPORARY: pin GhpGhx to the Julia 1.13 ccall fix branch (NatLabRockies/GhpGhx.jl#12).
      # Revert to the default branch once that PR is merged.
      - run: julia --project=. -e 'using Pkg; Pkg.activate("test"); Pkg.rm("Xpress"); Pkg.activate("."); using TestEnv; TestEnv.activate(); Pkg.add(PackageSpec(name="GhpGhx", url="https://github.com/NatLabRockies/GhpGhx.jl.git", rev="fix-ccall-lib-name-julia-113")); using GhpGhx; cd("test"); include("runtests.jl")'
        shell: bash
